<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="assets/Emirates_logo.png" alt="Emirates" height="40">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" (click)="toggleFlights()" style="cursor: pointer;">Vuelos</a>
          </li>

          <!-- Opciones cuando NO está logueado -->
          <li class="nav-item" *ngIf="!isLoggedIn">
            <a class="nav-link" href="/login">Iniciar sesión</a>
          </li>
          <li class="nav-item" *ngIf="!isLoggedIn">
            <a class="nav-link" href="/register">Registrarse</a>
          </li>

          <!-- Opciones para ADMIN -->
          <li class="nav-item" *ngIf="isAdmin">
            <a class="nav-link" href="/admin/dashboard">Panel Admin</a>
          </li>

          <!-- Opciones para CLIENTE -->
          <li class="nav-item" *ngIf="isCliente">
            <a class="nav-link" href="/customer/profile">Mi Cuenta</a>
          </li>
          <li class="nav-item" *ngIf="isCliente">
            <a class="nav-link" (click)="toggleCart()" style="cursor: pointer;">Carrito</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Ayuda</a>
          </li>

          <!-- Foto de perfil con dropdown (visible para logueados) -->
          <li class="nav-item profile-dropdown" *ngIf="isLoggedIn && currentUser">
            <img 
              [src]="currentUser.foto || 'assets/default-user.png'" 
              alt="Perfil" 
              class="profile-pic"
              (click)="toggleProfileMenu()"
              title="{{currentUser.nombre}} {{currentUser.apellido}}"
            >
            <!-- Menú dropdown -->
            <div class="profile-menu" *ngIf="showProfileMenu">
              <a href="/customer/profile" class="profile-menu-item">
                <i class="bi bi-person"></i> Mi Cuenta
              </a>
              <a (click)="logout()" class="profile-menu-item" style="cursor: pointer;">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
              </a>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

<div class="flights-dropdown" *ngIf="showFlights">
  <div class="cities-list">
    <h3>Ciudades</h3>
    <div *ngFor="let city of cities" class="city-item">{{city}}</div>
  </div>
</div>

<div class="cart-sidebar" [class.active]="showCart">
  <button class="close-btn" (click)="toggleCart()">✕</button>
</div>
