      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" (click)="toggleFlights()" style="cursor: pointer;">Vuelos</a>
          </li>
          <!-- Opciones cuando NO está logueado -->
          <li class="nav-item" *ngIf="!isLoggedIn">
            <a class="nav-link" href="/login">Iniciar sesión</a>
          </li>
          <li class="nav-item" *ngIf="!isLoggedIn">
            <a class="nav-link" href="/register">Registrarse</a>
          </li>

          <!-- Opciones para ADMIN -->
          <li class="nav-item" *ngIf="isAdmin">
            <a class="nav-link" href="/admin/dashboard">Panel Admin</a>
          </li>

          <li class="nav-item" *ngIf="isCliente">
            <a class="nav-link" href="/customer/profile">Mi Cuenta</a>
          </li>
          <li class="nav-item" *ngIf="isCliente">
            <a class="nav-link position-relative" (click)="toggleCart()" style="cursor: pointer;">

              </span>
            </a>

<div class="flights-dropdown" *ngIf="showFlights">
  <div class="cities-list">
    <h3>Ciudades</h3>
    <div *ngFor="let city of cities" class="city-item">{{city}}</div>
  </div>
</div>

<div class="cart-sidebar" [class.active]="showCart">
  <button class="close-btn" (click)="toggleCart()">✕</button>
</div>
