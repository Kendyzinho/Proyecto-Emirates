<div class="min-vh-100 d-flex align-items-center justify-content-center py-5 bg-gradient-custom">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          
          <!-- Header -->
          <div class="card-header bg-gradient-primary text-white text-center py-5 border-0">
            <div class="mb-3">
              <svg class="logo-icon mb-3" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1 class="display-5 fw-bold mb-2">Bienvenido</h1>
            <p class="lead mb-0 opacity-90">Inicia sesión en Emirates Airways</p>
          </div>

          <!-- Form Body -->
          <div class="card-body p-4 p-md-5">
            <form (ngSubmit)="procesarLogin()" #formValidacion="ngForm">
              
              <!-- Email -->
              <div class="mb-4">
                <label class="form-label fw-semibold">
                  <i class="bi bi-envelope me-2 text-danger"></i>Correo Electrónico
                </label>
                <input 
                  class="form-control form-control-lg"
                  [class.is-invalid]="email.invalid && email.touched"
                  [class.is-valid]="email.valid && email.touched"
                  type="email" 
                  name="email" 
                  placeholder="tu@email.com" 
                  [(ngModel)]="usuario.email" 
                  required 
                  email
                  #email="ngModel">
                <div class="invalid-feedback">
                  Ingresa un correo electrónico válido
                </div>
              </div>

              <!-- Contraseña -->
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <label class="form-label fw-semibold mb-0">
                    <i class="bi bi-lock me-2 text-danger"></i>Contraseña
                  </label>
                </div>
                <input 
                  class="form-control form-control-lg"
                  [class.is-invalid]="password.invalid && password.touched"
                  [class.is-valid]="password.valid && password.touched"
                  type="password" 
                  name="password" 
                  placeholder="Ingresa tu contraseña" 
                  [(ngModel)]="usuario.password" 
                  required 
                  minlength="8"
                  #password="ngModel">
                <div class="invalid-feedback">
                  La contraseña es obligatoria
                </div>
              </div>

              <!-- Botón Submit -->
              <div class="d-grid mb-4">
                <button 
                  type="submit" 
                  class="btn btn-primary btn-lg fw-semibold py-3 rounded-3"
                  [disabled]="formValidacion.invalid">
                  <span *ngIf="!formValidacion.invalid">Iniciar Sesión</span>
                  <span *ngIf="formValidacion.invalid">Completa todos los campos</span>
                </button>
              </div>



              <!-- Link a Registro -->
              <div class="text-center">
                <p class="text-muted mb-0">
                  ¿No tienes cuenta? 
                  <a href="/register" class="text-decoration-none fw-semibold text-danger">Regístrate aquí</a>
                </p>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
