
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5 bg-gradient-custom">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-6">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          
          <!-- Header -->
          <div class="card-header bg-white text-dark text-center py-5 border-0">
            <div class="mb-3">
              <img src="assets/Emirates_logo.png" alt="Emirates Logo" class="img-fluid" style="max-height: 80px;">
            </div>
            <h1 class="display-5 fw-bold mb-2 text-dark">Emirates Airways</h1>
            <p class="lead mb-0 text-muted">Crea tu cuenta y comienza a volar</p>
          </div>

          <!-- Form Body -->
          <div class="card-body p-4 p-md-5">
            <form (ngSubmit)="procesarInformacion()" #formValidacion="ngForm">
              
              <!-- Nombre y Apellido -->
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">
                    <i class="bi bi-person me-2 text-danger"></i>Nombre
                  </label>
                  <input 
                    class="form-control form-control-lg"
                    [class.is-invalid]="name.invalid && name.touched"
                    [class.is-valid]="name.valid && name.touched"
                    type="text" 
                    name="nombre" 
                    placeholder="Ej: Héctor" 
                    [(ngModel)]="persona.nombre" 
                    required 
                    #name="ngModel">
                  <div class="invalid-feedback">
                    El nombre es obligatorio
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-semibold">
                    <i class="bi bi-person me-2 text-danger"></i>Apellido
                  </label>
                  <input 
                    class="form-control form-control-lg"
                    [class.is-invalid]="apellido.invalid && apellido.touched"
                    [class.is-valid]="apellido.valid && apellido.touched"
                    type="text" 
                    name="apellido" 
                    placeholder="Ej: Ossandón" 
                    [(ngModel)]="persona.apellido" 
                    required 
                    #apellido="ngModel">
                  <div class="invalid-feedback">
                    El apellido es obligatorio
                  </div>
                </div>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  <i class="bi bi-envelope me-2 text-danger"></i>Correo Electrónico
                </label>
                <input 
                  class="form-control form-control-lg"
                  [class.is-invalid]="email.invalid && email.touched"
                  [class.is-valid]="email.valid && email.touched"
                  type="email" 
                  name="email" 
                  placeholder="tu@email.com" 
                  [(ngModel)]="persona.email" 
                  required 
                  email
                  #email="ngModel">
                <div class="invalid-feedback">
                  Ingresa un correo electrónico válido
                </div>
              </div>

              <!-- Contraseña -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  <i class="bi bi-lock me-2 text-danger"></i>Contraseña
                </label>
                <input 
                  class="form-control form-control-lg"
                  [class.is-invalid]="password.invalid && password.touched"
                  [class.is-valid]="password.valid && password.touched"
                  type="password" 
                  name="password" 
                  placeholder="Mínimo 8 caracteres" 
                  [(ngModel)]="persona.password" 
                  required 
                  minlength="8"
                  #password="ngModel">
                <div class="invalid-feedback">
                  La contraseña debe tener al menos 8 caracteres
                </div>
              </div>

              <!-- Confirmar Contraseña -->
              <div class="mb-4">
                <label class="form-label fw-semibold">
                  <i class="bi bi-lock-fill me-2 text-danger"></i>Confirmar Contraseña
                </label>
                <input 
                  class="form-control form-control-lg"
                  [class.is-invalid]="confirmPassword.touched && persona.password !== persona.confirmPassword"
                  [class.is-valid]="confirmPassword.touched && persona.password === persona.confirmPassword && confirmPassword.valid"
                  type="password" 
                  name="confirmPassword" 
                  placeholder="Repite tu contraseña" 
                  [(ngModel)]="persona.confirmPassword" 
                  required 
                  #confirmPassword="ngModel">
                <div class="invalid-feedback">
                  Las contraseñas no coinciden
                </div>
              </div>

              <!-- Botón Submit -->
              <div class="d-grid mb-3">
                <button 
                  type="submit" 
                  class="btn btn-primary btn-lg fw-semibold py-3 rounded-3"
                  [disabled]="formValidacion.invalid || persona.password !== persona.confirmPassword">
                  <span *ngIf="!formValidacion.invalid">Crear Cuenta</span>
                  <span *ngIf="formValidacion.invalid">Completa todos los campos</span>
                </button>
              </div>

              <!-- Link a Login -->
              <div class="text-center">
                <p class="text-muted mb-0">
                  ¿Ya tienes cuenta? 
                  <a href="/login" class="text-decoration-none fw-semibold text-danger">Iniciar sesión</a>
                </p>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
