<div class="page-container">

  <div class="booking-card">
    <app-search-flights (searchButton)="onSearchButton($event)" ></app-search-flights>
  </div>

  <div class="search-results">
    <div class="flight-card" *ngFor="let flight of flights">
      {{ flight.airline }} • {{ flight.route }} • {{ flight.price }}
    </div>
  </div>

</div>
