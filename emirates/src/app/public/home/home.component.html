<app-header></app-header>

<main class="home-content">
  <div class="container py-5">
    <div class="text-center mb-4">
      <h1 class="display-4 fw-bold">Encuentra tu próximo vuelo</h1>
    </div>

    <div class="card shadow-lg border-0">
      <div class="card-body p-4">
        <div class="row g-3">
          <div class="col-md-6 col-lg-3">
            <label class="form-label">Origen</label>
            <input type="text" class="form-control" placeholder="Ciudad de salida">
          </div>

          <div class="col-md-6 col-lg-3">
            <label class="form-label">Destino</label>
            <input type="text" class="form-control" placeholder="Ciudad de llegada">
          </div>

          <div class="col-md-6 col-lg-2">
            <label class="form-label">Fecha de salida</label>
            <input type="date" class="form-control">
          </div>

          <div class="col-md-6 col-lg-2">
            <label class="form-label">Fecha de regreso</label>
            <input type="date" class="form-control">
          </div>

          <div class="col-12 col-lg-2 d-flex align-items-end">
            <button class="btn btn-danger w-100">Buscar vuelos</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>
